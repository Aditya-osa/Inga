<!-- Coming Soon Section  -->
    <section class="bg-body-bg md:py-15 py-3.75 pt-3.75">

                    <form action="#" method="POST" class="flex md:gap-5 md:flex-row gap-2.5 flex-col md:w-4/5 mx-auto mt-7.5 mb-3.75">

                            <div class="flex justify-center gap-3.75 text-black">

                                <a href="#">
