@import url("https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@100,200,300,400,500,700,800,900,1&display=swap");

:root {
  --navy-dark: #076cec;
  --navy-overlay: rgba(7, 108, 236, 0.92);
  --blue-brand: #076cec;
  --green-accent: #08bd69;
  --green-hover: #079f59;
  --teal-accent: #1da888;
  --white: #ffffff;
  --text-light: #e2e8f0;
}

*,
*::before,
*::after {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Plus Jakarta Sans', sans-serif;
  background-color: #ffffff;
  color: #1e293b;
  overflow-x: hidden;
}

/* HERO SECTION */
.hero-section {
  position: relative;
  width: 100%;
  height: 80vh;
  min-height: 80vh;
  background-color: #ffffff;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

/* Subtle lab background photo */
.bg-texture {
  display: none;
}




/* NAVBAR */
.navbar {
  position: relative;
  z-index: 20;
  width: 100%;
  border-bottom: 1px solid rgba(255, 255, 255, 0.12);
  padding: 18px 0;
}

.nav-container {
  max-width: 1280px;
  margin: 0 auto;
  padding: 0 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: var(--white);
  font-size: 24px;
  font-weight: 800;
}

.logo-icon {
  width: 34px;
  height: 34px;
  background-color: var(--blue-brand);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

.nav-links {
  display: flex;
  gap: 32px;
}

.nav-links a {
  position: relative;
  text-decoration: none;
  color: var(--white);
  font-size: 15px;
  font-weight: 500;
  padding-bottom: 4px;
  transition: color 0.3s ease;
}

.nav-links a::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 2px;
  background-color: var(--white);
  transform: scaleX(0);
  transform-origin: bottom right;
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  border-radius: 2px;
}

.nav-links a:hover::after,
.nav-links a.active::after {
  transform: scaleX(1);
  transform-origin: bottom left;
}

.nav-links a:hover,
.nav-links a.active {
  color: var(--white);
}

.nav-actions {
  display: flex;
  align-items: center;
  gap: 20px;
}

.helpline {
  display: flex;
  align-items: center;
  gap: 12px;
  padding-right: 16px;
  border-right: 1px solid rgba(255, 255, 255, 0.2);
}

.phone-icon {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.15);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--white);
  font-size: 15px;
}

.helpline-info {
  display: flex;
  flex-direction: column;
}

.helpline-info span {
  font-size: 11px;
  color: #cbd5e1;
}

.helpline-info strong {
  font-size: 14px;
  font-weight: 700;
}

.icon-btn {
  background: none;
  border: none;
  color: var(--white);
  font-size: 16px;
  cursor: pointer;
  transition: color 0.3s ease;
}

.icon-btn:hover {
  color: var(--blue-brand);
}

/* SLIDER WRAPPER & SLIDES */
.slider-wrapper {
  position: relative;
  z-index: 10;
  flex: 1;
  display: flex;
  align-items: center;
}

.slide {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.6s ease, visibility 0.6s ease;
}

.slide.active {
  position: relative;
  opacity: 1;
  visibility: visible;
  width: 100%;
}

.slider-wrapper {
  position: relative;
  z-index: 10;
  width: 100%;
  height: 100%;
  flex: 1;
  display: flex;
}

.slide-container {
  width: 100%;
  max-width: 100%;
  margin: 0;
  padding: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: stretch;
  gap: 0;
  height: 100%;
  transform: none;
}

/* LEFT CONTENT (50%) */
.slide-content {
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: flex-start;
  padding-left: clamp(30px, 8vw, 130px);
  padding-right: clamp(24px, 4vw, 64px);
  padding-block: 40px;
  background-color: #ffffff;
  box-sizing: border-box;
  z-index: 2;
}

.slide-content h1,
.hero-title,
.hero-title *,
.reveal-line,
.reveal-line span {
  font-family: 'Cabinet Grotesk', sans-serif !important;
  font-weight: 700;
  line-height: 1.15em;
  color: #143b5e;
  font-size: clamp(38px, 4.2vw, 62px);
  letter-spacing: -0.02em;
}

.reveal-line:nth-child(2) span {
  color: #076cec;
}

.hero-title {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  margin: 0;
}

.reveal-line {
  position: relative;
  display: inline-block;
  overflow: hidden;
  padding: 2px 6px 2px 0;
  white-space: nowrap;
}

.reveal-line > span {
  display: inline-block;
  opacity: 0;
}

.reveal-line:nth-child(1) > span {
  animation: showText 0.01s linear 0.55s forwards;
}

.reveal-line:nth-child(2) > span {
  animation: showText 0.01s linear 0.7s forwards;
}

.reveal-line::after {
  content: "";
  position: absolute;
  inset: 0;
  background-color: #076cec;
  transform: scaleX(0);
  transform-origin: left;
}

.reveal-line:nth-child(1)::after {
  animation: blockReveal 0.85s cubic-bezier(0.77, 0, 0.175, 1) 0.15s forwards;
}

.reveal-line:nth-child(2)::after {
  animation: blockReveal 0.85s cubic-bezier(0.77, 0, 0.175, 1) 0.3s forwards;
}

.hero-desc {
  font-family: 'Inter', sans-serif;
  font-size: 17px;
  line-height: 1.65;
  font-weight: 400;
  color: #475569;
  margin-top: 16px;
  margin-bottom: 24px;
  max-width: 540px;
  animation: slideFadeUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.3s both;
}

.feature-list {
  list-style: none;
  margin-bottom: 36px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.feature-list li {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 16px;
  font-weight: 500;
  color: var(--text-light);
}

.feature-list li i {
  color: var(--green-accent);
  font-size: 18px;
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background-color: #ffffff;
  color: #076cec;
  text-decoration: none;
  padding: 14px 30px;
  border-radius: 16px;
  font-size: 16px;
  font-weight: 600;
  border: 1px solid #ffffff;
  box-shadow: 0 4px 18px rgba(0, 0, 0, 0.18);
  transition: all 0.3s ease;
}

.slide.active .btn-primary {
  animation: slideFadeUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.45s both;
}

.btn-primary:hover {
  background-color: #b8ff90;
  color: #076cec;
  border-color: #b8ff90;
  transform: translateY(-2px);
  box-shadow: 0 6px 22px rgba(0, 0, 0, 0.22);
}

/* Hero Button Group */
.hero-btn-group {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  margin-top: 8px;
  animation: slideFadeUp 0.65s cubic-bezier(0.22, 1, 0.36, 1) 0.45s both;
}

.btn-hero-primary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 14px 34px;
  border-radius: 50px;
  background-color: #076cec;
  color: #ffffff;
  font-family: 'Inter', sans-serif;
  font-size: 16px;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(7, 108, 236, 0.3);
}

.btn-hero-primary:hover {
  background-color: #0554b7;
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(7, 108, 236, 0.4);
  color: #ffffff;
}

.btn-hero-secondary {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 14px 30px;
  border-radius: 50px;
  background-color: #ffffff;
  color: #1e293b;
  border: 1px solid #e2e8f0;
  font-family: 'Inter', sans-serif;
  font-size: 16px;
  font-weight: 600;
  text-decoration: none;
  transition: all 0.25s ease;
}

.btn-hero-secondary:hover {
  background-color: #f8fafc;
  border-color: #cbd5e1;
  transform: translateY(-2px);
  color: #076cec;
}

/* RIGHT IMAGE VISUAL - 50% FULL NO PADDING */
.slide-visuals {
  position: relative;
  width: 100%;
  height: 100%;
  padding: 0;
  margin: 0;
  overflow: hidden;
  display: block;
  transform: none;
}

.hero-image-wrapper {
  position: relative;
  width: 100%;
  height: 100%;
  max-width: none;
  padding: 0;
  margin: 0;
  border-radius: 0;
  border: none;
  box-shadow: none;
  overflow: hidden;
}

.hero-main-img {
  width: 100%;
  height: 100%;
  min-height: 100%;
  object-fit: cover;
  object-position: center;
  display: block;
}

/* LEFT VERTICAL ARROWS */
.slider-arrows {
  position: absolute;
  left: 28px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 20;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.arrow-btn {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.35);
  background: rgba(255, 255, 255, 0.08);
  color: var(--white);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  transition: all 0.3s ease;
}

.arrow-btn:hover {
  background: var(--green-accent);
  border-color: var(--green-accent);
}

.hero-section {
  min-height: 80vh;
  height: 80vh;
  background-color: #ffffff;
}





.hero-section.is-transitioning {
  background-color: #076cec;
}






.navbar {
  padding: 29px 0 24px;
  border-bottom: 0;
}

.nav-container {
  max-width: none;
  padding: 0 46px;
  justify-content: flex-start;
}

.logo {
  gap: 8px;
  font-size: 21px;
}

.logo-icon {
  width: 34px;
  height: 34px;
  border-radius: 6px;
  color: #083d38;
  font-size: 17px;
}

.logo-text {
  line-height: 1;
}

.logo-text small {
  display: block;
  margin-top: 3px;
  font-size: 5px;
  font-weight: 500;
  letter-spacing: 0.02em;
}

.nav-links {
  gap: 32px;
  margin-left: clamp(56px, 9.5vw, 160px);
}

.nav-links a {
  font-size: 14px;
  font-weight: 700;
}

.nav-actions {
  gap: 22px;
  margin-left: auto;
}

.helpline {
  gap: 10px;
  padding-right: 26px;
}

.phone-icon {
  width: 35px;
  height: 35px;
  background: var(--white);
  color: var(--blue-brand);
  font-size: 14px;
}

.helpline-info strong {
  font-size: 15px;
}



.slider-arrows {
  left: 62px;
  top: 55%;
  gap: 12px;
}

.arrow-btn {
  width: 28px;
  height: 28px;
  border: 0;
  border-radius: 3px;
  background: rgba(142, 167, 193, 0.28);
  clip-path: polygon(50% 0, 100% 25%, 100% 75%, 50% 100%, 0 75%, 0 25%);
}

@media (max-width: 1200px) {
  .nav-links {
    gap: 20px;
    margin-left: clamp(28px, 5vw, 70px);
  }

  .nav-actions {
    gap: 16px;
  }

  .helpline {
    padding-right: 18px;
  }





  .slider-dots {
    left: 40px;
  }
}

/* BOTTOM PAGINATION DOTS */
.slider-dots {
  position: absolute;
  bottom: 32px;
  left: calc(50% - 600px);
  z-index: 20;
  display: flex;
  align-items: center;
  gap: 10px;
}

.dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.45);
  cursor: pointer;
  transition: all 0.3s ease;
}

.dot.active {
  width: 10px;
  height: 10px;
  background: var(--green-accent);
  box-shadow: 0 0 0 4px rgba(24, 184, 104, 0.3);
}

.slider-dots {
  left: max(30px, calc((100% - 1360px) / 2 + 30px));
  bottom: 55px;
  gap: 9px;
}

.dot,
.dot.active {
  width: 7px;
  height: 7px;
}

.dot.active {
  background: var(--green-accent);
  box-shadow: 0 0 0 4px rgba(8, 189, 105, 0.3);
  animation: dotActivate 0.45s ease-out both;
}

@keyframes slideFadeUp {
  from {
    opacity: 0;
    transform: translateY(28px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes blockReveal {
  0% {
    transform: scaleX(0);
    transform-origin: left;
  }

  48% {
    transform: scaleX(1);
    transform-origin: left;
  }

  52% {
    transform: scaleX(1);
    transform-origin: right;
  }

  100% {
    transform: scaleX(0);
    transform-origin: right;
  }
}

@keyframes showText {
  to {
    opacity: 1;
  }
}



@keyframes slideFromRight {
  from {
    opacity: 0;
    transform: translateX(60px);
  }

  to {
    opacity: 1;
    transform: translateX(0);
  }
}

@keyframes backgroundReveal {
  from {
    opacity: 0.08;
  }

  to {
    opacity: 1;
  }
}

@keyframes dotActivate {
  from {
    transform: scale(0.7);
    box-shadow: 0 0 0 0 rgba(8, 189, 105, 0.3);
  }

  to {
    transform: scale(1);
    box-shadow: 0 0 0 4px rgba(8, 189, 105, 0.3);
  }
}

@media (prefers-reduced-motion: reduce) {
  .slide,
  .slide *,
  .bg-texture,

  
  .dot {
    animation: none !important;
    transition: none !important;
  }

  .slide.active .reveal-line > span {
    opacity: 1 !important;
  }

  .reveal-line::after {
    display: none;
  }
}

html.embedded-banner,
html.embedded-banner body {
  height: 100%;
  min-height: 100%;
  overflow: hidden;
}

html.embedded-banner .navbar,
html.embedded-banner .header-topbar {
  display: none;
}

html.embedded-banner .hero-section {

/* Header Topbar */

  position: relative;
  z-index: 30;
  background-color: #1e2022;

.header-topbar-container {

.header-topbar-content {

  flex-wrap: wrap;
  gap: 14px;
  font-size: 13px;

  margin-right: 0;
}

.topbar-social-link {
  display: inline-flex;
  align-items: center;
  justify-content: center;

  text-decoration: none;

.topbar-social-link:hover {

.topbar-divider {

}

.topbar-contact-item:hover {

}

.topbar-icon {
  width: 14px;
  height: 14px;
  color: #076cec;
  fill: currentColor;
  flex-shrink: 0;
  display: inline-block;
  vertical-align: middle;
}

.topbar-social-link .topbar-icon {
  width: 13px;
  height: 13px;
}

.topbar-slash {
  color: #076cec;
  font-weight: 700;
  padding-inline: 2px;

@media (max-width: 48rem) {
  .header-topbar {
    padding-block: 6px;
  }
  .header-topbar-content {
    gap: 8px;
    font-size: 11px;
    justify-content: center;
  }
  .topbar-contact-item {
    font-size: 11px;
    gap: 5px;
  }
  .topbar-icon {
    width: 13px;
    height: 13px;
  }
}

/* RESPONSIVE DESIGN */
@media (max-width: 1280px) {
  .slider-dots {
    left: 40px;
  }
}

@media (max-width: 1200px) {
  .slider-arrows {
    display: none;
  }
}

@media (max-width: 992px) {

  .hero-main-img {

  }

  .slider-dots {

}</style>
